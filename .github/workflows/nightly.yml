# pcxgg forks: the Gradle build resolves the plugwright Gradle plugin 3.1.0-pcx.1 and MockBukkit
# mockbukkit-v26.3:4.118.0-pcx.1 from mavenLocal (neither is published), so every job runs
# .github/actions/bootstrap-forks, which builds pcxgg/plugwright (and pcxgg/MockBukkit where the
# job needs it) before its first Gradle step.

name: Nightly Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Bootstrap pcxgg forks
        uses: ./.github/actions/bootstrap-forks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew shadowJar

      - name: Get short SHA
        id: sha
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Get current date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Rename jar with build info
        run: |
          mv build/libs/xInventories-*.jar build/libs/xInventories-nightly-${{ steps.sha.outputs.SHORT_SHA }}.jar

      - name: Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: "Nightly Build"
          body: |
            ## 🌙 Nightly Build

            **Latest development build from main branch.**

            - **Commit:** ${{ github.sha }}
            - **Date:** ${{ steps.date.outputs.DATE }}
            - **Branch:** main

            ### ⚠️ Warning
            This is an automated development build and may be unstable.
            For stable releases, see the [latest release](https://github.com/PCX-SH/xInventories/releases/latest).

            ### Installation
            1. Download `xInventories-nightly-${{ steps.sha.outputs.SHORT_SHA }}.jar`
            2. Place in your server's `plugins/` folder
            3. Restart your server

            ### Requirements
            - **Paper 1.20.5+**
            - **Java 21+**
          files: build/libs/xInventories-nightly-*.jar
          prerelease: true
          make_latest: false
