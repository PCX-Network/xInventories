# CodeQL workflow - Security vulnerability scanning
# Scans for security issues in Kotlin/Java code
# Runs on pushes, PRs, and weekly schedule for comprehensive coverage
#
# TODO: Re-enable when CodeQL supports Kotlin 2.3.0
# Currently disabled because CodeQL only supports Kotlin < 2.2.30
# Track: https://github.com/github/codeql/issues
#
# PCX-Network forks: every Gradle invocation resolves the plugwright Gradle plugin 3.1.0-pcx.1
# (settings.gradle, via mavenLocal) and test tasks also resolve MockBukkit
# org.mockbukkit.mockbukkit:mockbukkit-v26.3:4.118.0-pcx.1 (build.gradle, via mavenLocal). Neither is
# published yet, so this job fails on a clean runner until either (a) both are published (MockBukkit:
# push and tag the fork, then use the JitPack coordinates
# com.github.PCX-Network.MockBukkit:mockbukkit-v26.3:<tag>; plugwright: publish the Gradle plugin to a
# repository listed in settings.gradle pluginManagement), or (b) a step before Gradle checks out
# PCX-Network/plugwright (branch pcx/26.3; `cd gradle-plugin && ./gradlew publishToMavenLocal`) and
# PCX-Network/MockBukkit (branch minecraft/v26.3; `./gradlew publishToMavenLocal`).

name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Temporarily skip until CodeQL supports Kotlin 2.3.0
    if: false

    permissions:
      # Required for CodeQL analysis
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      # Initialize CodeQL for Java/Kotlin analysis
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          # Use extended queries for more thorough analysis
          queries: +security-extended

      # Build the project using CodeQL's autobuild
      # This ensures CodeQL can properly trace the compilation
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # Perform CodeQL analysis
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
