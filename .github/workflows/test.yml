# Test workflow - Runs tests on PRs and pushes to main
# Ensures code quality by running the full test suite
# Uses JUnit 5 with Kotlin test framework
#
# PCX-Network forks: every Gradle invocation resolves the plugwright Gradle plugin 3.1.0-pcx.1
# (settings.gradle, via mavenLocal) and test tasks also resolve MockBukkit
# org.mockbukkit.mockbukkit:mockbukkit-v26.3:4.118.0-pcx.1 (build.gradle, via mavenLocal). Neither is
# published yet, so this job fails on a clean runner until either (a) both are published (MockBukkit:
# push and tag the fork, then use the JitPack coordinates
# com.github.PCX-Network.MockBukkit:mockbukkit-v26.3:<tag>; plugwright: publish the Gradle plugin to a
# repository listed in settings.gradle pluginManagement), or (b) a step before Gradle checks out
# PCX-Network/plugwright (branch pcx/26.3; `cd gradle-plugin && ./gradlew publishToMavenLocal`) and
# PCX-Network/MockBukkit (branch minecraft/v26.3; `./gradlew publishToMavenLocal`).

name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Build/test require JDK 25 (paper-api 26.x is compiled against Java 25). The produced jar is
    # Java 21 bytecode, so it still runs on Java 21 servers (1.20.5 - 1.21.x).
    strategy:
      matrix:
        java-version: [ '25' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Run the test suite
      - name: Run tests
        run: ./gradlew test

      # Upload test results for review even on failure
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-java-${{ matrix.java-version }}
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

      # Publish test results as PR comment/check
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: 'build/test-results/test/TEST-*.xml'
          fail_on_failure: true
          require_tests: true
