# Coverage workflow - Generates and uploads code coverage reports
# Uses JaCoCo for coverage measurement and Codecov for reporting
#
# To display coverage badge in README, add:
# [![codecov](https://codecov.io/gh/OWNER/REPO/branch/main/graph/badge.svg)](https://codecov.io/gh/OWNER/REPO)
#
# PCX-Network forks: every Gradle invocation resolves the plugwright Gradle plugin 3.1.0-pcx.1
# (settings.gradle, via mavenLocal) and test tasks also resolve MockBukkit
# org.mockbukkit.mockbukkit:mockbukkit-v26.3:4.118.0-pcx.1 (build.gradle, via mavenLocal). Neither is
# published yet, so this job fails on a clean runner until either (a) both are published (MockBukkit:
# push and tag the fork, then use the JitPack coordinates
# com.github.PCX-Network.MockBukkit:mockbukkit-v26.3:<tag>; plugwright: publish the Gradle plugin to a
# repository listed in settings.gradle pluginManagement), or (b) a step before Gradle checks out
# PCX-Network/plugwright (branch pcx/26.3; `cd gradle-plugin && ./gradlew publishToMavenLocal`) and
# PCX-Network/MockBukkit (branch minecraft/v26.3; `./gradlew publishToMavenLocal`).

name: Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Run tests with coverage enabled
      - name: Run tests with coverage
        run: ./gradlew test jacocoTestReport

      # Upload coverage report to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Upload coverage report as artifact for local review
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: build/reports/jacoco/
          retention-days: 7
