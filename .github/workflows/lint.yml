# Lint workflow - Runs Detekt static analysis on Kotlin code
# Detekt checks for code smells, complexity, style issues, and potential bugs
# Results are uploaded to GitHub Security tab via SARIF format
#
# PCX-Network forks: every Gradle invocation resolves the plugwright Gradle plugin 3.1.0-pcx.1
# (settings.gradle, via mavenLocal) and test tasks also resolve MockBukkit
# org.mockbukkit.mockbukkit:mockbukkit-v26.3:4.118.0-pcx.1 (build.gradle, via mavenLocal). Neither is
# published yet, so this job fails on a clean runner until either (a) both are published (MockBukkit:
# push and tag the fork, then use the JitPack coordinates
# com.github.PCX-Network.MockBukkit:mockbukkit-v26.3:<tag>; plugwright: publish the Gradle plugin to a
# repository listed in settings.gradle pluginManagement), or (b) a step before Gradle checks out
# PCX-Network/plugwright (branch pcx/26.3; `cd gradle-plugin && ./gradlew publishToMavenLocal`) and
# PCX-Network/MockBukkit (branch minecraft/v26.3; `./gradlew publishToMavenLocal`).

name: Lint

on:
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    # Required for uploading SARIF to Security tab
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Detekt 1.23.8 (latest release) can't run on JDK 25. The detekt task runs in-process and does
      # not compile against paper-api, so this job runs on JDK 21 (no JDK 25 needed for linting).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Run Detekt static analysis
      - name: Run Detekt
        run: ./gradlew detekt
        continue-on-error: true

      # Upload SARIF results to GitHub Security tab
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: build/reports/detekt/detekt.sarif

      # Upload Detekt report as artifact
      - name: Upload Detekt report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: detekt-report
          path: build/reports/detekt/
          retention-days: 7
