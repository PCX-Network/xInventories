import me.drownek.plugwright.local.LocalMode

plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.0'
    id 'org.jetbrains.dokka' version '1.9.20'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'xyz.jpenilla.run-paper' version '3.1.0'
    // Code coverage with JaCoCo
    id 'jacoco'
    // Static analysis with Detekt
    id 'io.gitlab.arturbosch.detekt' version '1.23.8'
    // End-to-end tests against a real Paper server (src/test/e2e). 3.1.0-pcx.1 is the pcxgg
    // fork that runs the bots on Minecraft 26.2/26.3; it comes from mavenLocal (see settings.gradle).
    id 'io.github.drownek.plugwright' version '3.1.0-pcx.1'
}

group = 'sh.pcx'
version = '1.2.1'

// Library versions - used in both dependencies and plugin.yml
ext {
    kotlinVersion = '2.3.0'
    coroutinesVersion = '1.11.0'
    serializationVersion = '1.11.0'
    caffeineVersion = '3.3.0'
    hikariVersion = '7.1.0'
    jedisVersion = '7.5.2'
    slf4jVersion = '2.0.16'
    commonsPool2Version = '2.12.0'
    gsonVersion = '2.12.1'

    // Runtime dependencies with SHA-256 checksums (Base64 encoded)
    // These are downloaded by XInventoriesLoader on servers without Paper's library loader
    runtimeDeps = [
        [group: 'org.jetbrains.kotlin', artifact: 'kotlin-stdlib', version: kotlinVersion,
         sha256: 'iHWHyRcTJQrVL+FK2RZtBCwzg1BJiQ6UN/NV/8WhlbE='],
        [group: 'org.jetbrains.kotlinx', artifact: 'kotlinx-coroutines-core-jvm', version: coroutinesVersion,
         sha256: '0ddaoB3/u00cUg5n5MTn9fYXRxjny0YyQSUD8vDmBPo='],
        [group: 'org.jetbrains.kotlinx', artifact: 'kotlinx-serialization-core-jvm', version: serializationVersion,
         sha256: '9KgBxkfUNRMnzZ4axBE+K+nqN6ZKsKuuJpwlpS4o810='],
        [group: 'org.jetbrains.kotlinx', artifact: 'kotlinx-serialization-json-jvm', version: serializationVersion,
         sha256: 'VjoltOtckSiunCR589GlxE3NF2ESuRzwNoLpBuulyTU='],
        [group: 'com.github.ben-manes.caffeine', artifact: 'caffeine', version: caffeineVersion,
         sha256: 'nZ0s/Wgf2Sct7T0nyZMNsS+J9zI0WXWqET68Iju/EiQ='],
        [group: 'com.zaxxer', artifact: 'HikariCP', version: hikariVersion,
         sha256: 'K+RcZBuEHoHfhykuGB8sIDUAxfDpoWdvE1knOH889As='],
        [group: 'org.slf4j', artifact: 'slf4j-api', version: slf4jVersion,
         sha256: 'oSV43eG6AL2bgW04iguHmSjQC6s8g8JA9wE79BlsV5o='],
        [group: 'redis.clients', artifact: 'jedis', version: jedisVersion,
         sha256: '/FoLQ33g4g9JTHfDaBFECZ8hsRq+jX6HNhx26DTwbyQ='],
        [group: 'org.apache.commons', artifact: 'commons-pool2', version: commonsPool2Version,
         sha256: 'bTvRjfhBDz4xsDGspYLMEJNCNYpionWevQxM3zDQb4s='],
        [group: 'com.google.code.gson', artifact: 'gson', version: gsonVersion,
         sha256: '6+4T1ft0d81/HMAQ4MNW34yoBwlxUkjal/eeNcy0++w=']
    ]
}

repositories {
    mavenCentral()
    // MockBukkit 26.3 is not released upstream yet: the tests use the pcxgg fork
    // (github.com/pcxgg/MockBukkit, branch minecraft/v26.3), installed locally with
    // `./gradlew publishToMavenLocal` in the fork. Restricted to that group so nothing else
    // resolves from ~/.m2.
    mavenLocal {
        content { includeGroup 'org.mockbukkit.mockbukkit' }
    }
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
    maven { url = 'https://jitpack.io' }
    // MyWorlds / BKCommonLib
    maven { url = 'https://ci.mg-dev.eu/plugin/repository/everything' }
}

dependencies {
    // Paper API for the MAIN source set: the OLDEST 26.x API, on purpose. The jar must run on every
    // server from 1.20.5 to the current 26.3. Paper 26.3 ships Adventure 5, and a jar compiled against
    // it binds TextComponent.Builder.build() to the Adventure-5 descriptor, which throws
    // NoSuchMethodError on 26.1/26.2 (Adventure 4) and breaks every command. Adventure 5 keeps the
    // Adventure-4 descriptors as bridges, so compiling against 26.1.2 runs everywhere. DO NOT bump this
    // to 26.3; bump the TEST classpath instead (see testImplementation below), which is where the
    // newest server is exercised (MockBukkit 26.3 + the plugwright suite on Paper 26.3).
    // Note: Paper switched to year-based versioning at 26.1; the coordinate format changed from
    // "{VERSION}-R0.1-SNAPSHOT" to "{VERSION}.build.{N}-stable" (no more -SNAPSHOT).
    compileOnly 'io.papermc.paper:paper-api:26.1.2.build.71-stable'

    // Kotlin - provided by Paper 1.21+, loaded via plugin.yml libraries for 1.20.5-1.20.6
    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib'

    // Coroutines - downloaded by Paper's library loader at runtime
    compileOnly "org.jetbrains.kotlinx:kotlinx-coroutines-core:${coroutinesVersion}"

    // Serialization - downloaded by Paper's library loader at runtime
    compileOnly "org.jetbrains.kotlinx:kotlinx-serialization-json:${serializationVersion}"

    // Caching - downloaded by Paper's library loader at runtime
    compileOnly "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}"

    // Database - downloaded by Paper's library loader at runtime
    compileOnly "com.zaxxer:HikariCP:${hikariVersion}"

    // Redis client for cross-server sync - downloaded by Paper's library loader at runtime
    compileOnly "redis.clients:jedis:${jedisVersion}"

    // Soft dependencies
    compileOnly('com.github.MilkBowl:VaultAPI:1.7.1') {
        exclude group: 'org.bukkit', module: 'bukkit'
    }
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'net.luckperms:api:5.5'

    // bStats metrics
    implementation 'org.bstats:bstats-bukkit:3.2.1'

    // PerWorldInventory-kt (archived but API functional)
    // Note: PWI has many transitive deps - exclude all and access via reflection at runtime
    compileOnly('com.github.ebonjaeger:perworldinventory-kt:2.3.2') {
        transitive = false
    }
    // MyWorlds + BKCommonLib for NBT parsing
    compileOnly('com.bergerkiller.bukkit:MyWorlds:1.21.11-v2') {
        transitive = false
    }
    compileOnly('com.bergerkiller.bukkit:BKCommonLib:1.20.4-v3') {
        transitive = false
    }

    // Testing - use kotlin-test-junit5 to bridge kotlin.test to JUnit 5
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:${kotlinVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
    testImplementation 'io.mockk:mockk:1.14.11'
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:${coroutinesVersion}"

    // Runtime dependencies needed for tests (downloaded by Paper's library loader at runtime)
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:${coroutinesVersion}"
    testImplementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${serializationVersion}"
    testImplementation "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}"
    testImplementation "com.zaxxer:HikariCP:${hikariVersion}"
    testImplementation "redis.clients:jedis:${jedisVersion}"
    // Tests run against the NEWEST Paper API (what MockBukkit 26.x targets); main stays on 26.1.2, see above.
    testImplementation 'io.papermc.paper:paper-api:26.3.build.181-stable'
    // MockBukkit for Minecraft 26.3 from the pcxgg fork (upstream has no mockbukkit-v26.3
    // release yet), resolved from mavenLocal (see repositories). For CI, once the fork is pushed and
    // tagged, switch to the JitPack coordinates (the jitpack.io repository is already listed):
    //   testImplementation('com.github.pcxgg.MockBukkit:mockbukkit-v26.3:<tag>')
    testImplementation('org.mockbukkit.mockbukkit:mockbukkit-v26.3:4.118.0-pcx.1') {
        exclude group: 'org.jetbrains.kotlin'
        exclude group: 'org.jetbrains.kotlinx'
    }
    testImplementation 'org.xerial:sqlite-jdbc:3.53.4.0'
    // Vault API for economy tests
    testImplementation('com.github.MilkBowl:VaultAPI:1.7.1') {
        exclude group: 'org.bukkit', module: 'bukkit'
    }
    // LuckPerms API for hook tests
    testImplementation 'net.luckperms:api:5.5'
    // PlaceholderAPI for hook tests
    testImplementation 'me.clip:placeholderapi:2.12.3'

    // Embedded Redis for sync tests
    testImplementation 'com.github.codemonstur:embedded-redis:1.4.4'
}

kotlin {
    // Toolchain is JDK 25 because paper-api 26.x (Minecraft 26.1+) requires Java 25 to compile.
    jvmToolchain(25)

    // ...but emit Java 21 bytecode and restrict to the Java 21 API surface so the SAME jar still
    // loads & runs on Java 21 servers (Minecraft 1.20.5 - 1.21.x). The plugin uses no 26.1-only
    // API directly; version-specific behavior is handled at runtime via VersionDetector/compat.
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
        freeCompilerArgs.add("-Xjdk-release=21")
    }
}

// The Java loader (XInventoriesLoader) is the server's entry point and MUST be Java 21 bytecode so
// it loads on Java 21 servers. --release 21 also restricts to the Java 21 platform API.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

// Downtargeting to Java 21 (above) makes Gradle advertise this consumer as JVM 21, which would
// reject paper-api 26.x (published for JVM 25). Override the target-JVM attribute on the compile
// and test classpaths so the Java-25 paper-api variant resolves while our own bytecode stays at 21.
['compileClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { cfgName ->
    configurations.named(cfgName).configure {
        attributes {
            attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}

processResources {
    def props = [
        version: version,
        kotlinVersion: kotlinVersion,
        coroutinesVersion: coroutinesVersion,
        serializationVersion: serializationVersion,
        caffeineVersion: caffeineVersion,
        hikariVersion: hikariVersion,
        jedisVersion: jedisVersion
    ]
    inputs.properties(props)
    filesMatching('plugin.yml') {
        expand(props)
    }
}

shadowJar {
    archiveClassifier.set('')

    // Relocate bStats to avoid conflicts with other plugins
    relocate 'org.bstats', 'sh.pcx.xinventories.lib.bstats'

    // Minimize jar - bStats is the only runtime dependency now
    minimize {
        exclude dependency('org.bstats:bstats-bukkit:.*')
    }

    // Exclude compile-time only stuff
    exclude 'org/jetbrains/annotations/**'
    exclude 'org/intellij/lang/annotations/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/maven/**'
    exclude 'META-INF/proguard/**'
    exclude 'META-INF/native-image/**'
}

// Generate RuntimeDependencies.java with dependency info from build.gradle
task generateDependencies {
    def outputDir = file("${buildDir}/generated/sources/dependencies/java/main")
    def outputFile = file("${outputDir}/sh/pcx/xinventories/loader/RuntimeDependencies.java")

    outputs.file(outputFile)

    doLast {
        outputDir.mkdirs()
        file("${outputDir}/sh/pcx/xinventories/loader").mkdirs()

        def deps = project.ext.runtimeDeps
        def depsArray = deps.collect { dep ->
            """        {"${dep.group}", "${dep.artifact}", "${dep.version}", "${dep.sha256}"}"""
        }.join(',\n')

        outputFile.text = """package sh.pcx.xinventories.loader;

/**
 * Auto-generated runtime dependency definitions.
 * DO NOT EDIT - This file is generated by the build script from build.gradle.
 *
 * To update dependencies, modify the runtimeDeps list in build.gradle.
 */
public final class RuntimeDependencies {
    private RuntimeDependencies() {}

    /**
     * Runtime dependencies: {groupId, artifactId, version, sha256}
     */
    public static final String[][] DEPENDENCIES = {
${depsArray}
    };
}
"""
        println "Generated RuntimeDependencies.java with ${deps.size()} dependencies"
    }
}

// Make sure generateDependencies runs before compilation
compileJava.dependsOn generateDependencies
compileKotlin.dependsOn generateDependencies

// Add generated sources to the Java source set
sourceSets {
    main {
        java {
            srcDir "${buildDir}/generated/sources/dependencies/java/main"
        }
    }
}

build {
    dependsOn shadowJar
}

runServer {
    minecraftVersion '26.3'
}

// ==================== Plugwright E2E Configuration ====================
// End-to-end tests (src/test/e2e) run with mineflayer bots against a real Paper server.
// Run: ./gradlew plugwrightTest

plugwright {
    testsDir.set(file('src/test/e2e'))
    environments { envs ->
        envs.create('local', LocalMode.INSTANCE) { spec ->
            // Newest Paper: the pcxgg plugwright fork's runner (src/test/e2e/package.json) joins
            // 26.3 servers (protocol 777) through the pcxgg mineflayer/minecraft-protocol/
            // minecraft-data forks. The plugin itself is compiled against 26.1.2 (see dependencies).
            spec.minecraftVersion.set('26.3')
            spec.acceptEula.set(true)
            spec.port.set(25568)
            spec.rconPort.set(25578)
            spec.jvmArgs.set(['-Xmx2G'])
            // Put world_nether in its own group so world changes swap inventories.
            spec.writeFiles { files ->
                files.file('plugins/xInventories/groups.yml', file('src/test/e2e/server-files/groups.yml'))
                files.file('plugins/xInventories/config.yml', file('src/test/e2e/server-files/config.yml'))
            }
        }
        // Importers against real source plugins / their real on-disk formats. xInventories starts
        // with a single group (server-files/imports/xinv-groups-single.yml) so it never swaps
        // inventories while Multiverse-Inventories does; the specs switch to server-files/groups.yml.
        envs.create('imports', LocalMode.INSTANCE) { spec ->
            spec.minecraftVersion.set('26.3')
            spec.acceptEula.set(true)
            spec.port.set(25569)
            spec.rconPort.set(25579)
            spec.jvmArgs.set(['-Xmx2G'])
            spec.downloadPlugins { dl ->
                dl.url('https://github.com/Multiverse/Multiverse-Core/releases/download/5.8.1/multiverse-core-5.8.1.jar')
                dl.url('https://github.com/Multiverse/Multiverse-Inventories/releases/download/5.3.6/multiverse-inventories-5.3.6.jar')
            }
            spec.writeFiles { files ->
                files.file('plugins/xInventories/config.yml', file('src/test/e2e/server-files/config.yml'))
                files.file('plugins/xInventories/groups.yml', file('src/test/e2e/server-files/imports/xinv-groups-single.yml'))
                files.file('plugins/Multiverse-Inventories/groups.yml', file('src/test/e2e/server-files/imports/mvi-groups.yml'))
                // PerWorldInventory cannot run on 26.x: its data folder, hand-written in the exact
                // format PerWorldInventory-kt 2.3.2 writes, stands in for a server that removed it.
                def pwi = file('src/test/e2e/server-files/imports/PerWorldInventory')
                fileTree(pwi).each { f ->
                    files.file("plugins/PerWorldInventory/${pwi.toPath().relativize(f.toPath()).toString().replace('\\', '/')}", f)
                }
            }
        }
        // Real MyWorlds 2.0.1 (+ BKCommonLib, both run on Paper 26.3) with per-world inventories, in
        // its own server so it does not fight Multiverse-Inventories over the inventory. It also
        // carries a Multiverse-Inventories data folder WITHOUT the plugin (server-files/myworlds,
        // files written by MVI 5.3.6), the state a server is in after removing MVI.
        envs.create('myworlds', LocalMode.INSTANCE) { spec ->
            spec.minecraftVersion.set('26.3')
            spec.acceptEula.set(true)
            spec.port.set(25570)
            spec.rconPort.set(25580)
            spec.jvmArgs.set(['-Xmx2G'])
            spec.downloadPlugins { dl ->
                dl.url('https://ci.mg-dev.eu/job/BKCommonLib/2073/artifact/build/BKCommonLib-2.0.5-SNAPSHOT-2073.jar')
                dl.url('https://ci.mg-dev.eu/job/MyWorlds/370/artifact/target/MyWorlds-2.0.1-370.jar')
            }
            spec.writeFiles { files ->
                files.file('plugins/xInventories/config.yml', file('src/test/e2e/server-files/config.yml'))
                files.file('plugins/xInventories/groups.yml', file('src/test/e2e/server-files/imports/xinv-groups-single.yml'))
                files.file('plugins/My_Worlds/config.yml', file('src/test/e2e/server-files/myworlds/my-worlds-config.yml'))
                def mvi = file('src/test/e2e/server-files/myworlds/Multiverse-Inventories')
                fileTree(mvi).each { f ->
                    files.file("plugins/Multiverse-Inventories/${mvi.toPath().relativize(f.toPath()).toString().replace('\\', '/')}", f)
                }
            }
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showExceptions true
        showCauses true
        showStackTraces true
    }
}

// ==================== Dokka Configuration ====================
// API documentation generation

tasks.dokkaHtml.configure {
    moduleName.set("xInventories")
    dokkaSourceSets {
        named("main") {
            sourceLink {
                localDirectory.set(file("src/main/kotlin"))
                remoteUrl.set(uri("https://github.com/PCX-SH/xInventories/tree/main/src/main/kotlin").toURL())
                remoteLineSuffix.set("#L")
            }
            // Skip deprecated members
            skipDeprecated.set(false)
            // Report undocumented members
            reportUndocumented.set(false)
            // Suppress inherited members from external libraries
            suppressInheritedMembers.set(true)
        }
    }
}

// ==================== JaCoCo Configuration ====================
// Code coverage reporting for test suite

jacoco {
    // 0.8.13+ is needed to instrument Java 25 class files (major version 69).
    toolVersion = "0.8.15"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

// ==================== Detekt Configuration ====================
// Static analysis for Kotlin code quality

detekt {
    // Use default config as baseline
    buildUponDefaultConfig = true
    // Enable all rules by default
    allRules = false
    // Configuration file (optional - uses defaults if not present)
    config.setFrom(files("$projectDir/detekt.yml"))
    // Don't fail build on issues - just report them
    ignoreFailures = true
    // Baseline file for suppressing existing issues (optional)
    // baseline = file("$projectDir/detekt-baseline.xml")
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    // Detekt 1.23.8 (the latest release) doesn't support JDK 25: it rejects --jvm-target 25 and
    // fails parsing the JVM version. Detekt runs in-process in the Gradle JVM and does NOT compile
    // against paper-api, so the lint CI job runs Gradle on JDK 21 (see lint.yml). Targeting 21 here
    // keeps it consistent.
    jvmTarget = "21"
    reports {
        // Enable SARIF for GitHub Security tab integration
        sarif.required = true
        html.required = true
        xml.required = true
        txt.required = false
    }
}
